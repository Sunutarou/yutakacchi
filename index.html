    function showTitle() {

    function renderTitle() {
        const savedData = localStorage.getItem("yutakatch_save");
        let html = "<br>";
        html += (titleCursorIndex === 0) ? "▶ 💖 はじめから<br>" : " 💖 はじめから<br>";
        if (savedData) {
            html += (titleCursorIndex === 1) ? "▶ 💋 つづきから" : " 💋 つづきから";
        } else {
            html += "<br>セーブデータがありません";
        }
        document.getElementById('message-content').innerHTML = html;
    }

    function pickRandomEvent(events) {
        const totalRate = events.reduce((sum, e) => sum + e.rate, 0);
        let rand = Math.random() * totalRate;
        for (const event of events) {
            rand -= event.rate;
            if (rand <= 0) return event;
        }
        return events[0];
    }

    function saveGame() {
        localStorage.setItem("yutakatch_save", JSON.stringify(gameState));
        document.getElementById('message-content').innerText = "セーブしました。";
    }

    function loadGame() {
        const savedData = localStorage.getItem("yutakatch_save");
        if (!savedData) return;
        const loadedState = JSON.parse(savedData);
        Object.assign(gameState, loadedState);
        updateStatus();
        currentEvent = null; currentStepIndex = -1; isShowingResult = false; isReadyToAdvanceWeek = false;
        isGameFinished = (gameState.totalWeek >= 104);
        document.getElementById('event-image').style.display = 'none';
        document.getElementById('char-image').style.display = 'none';
        document.getElementById('message-content').innerText = "コンテニューしました。";
        isTitleScreen = false;
    }
