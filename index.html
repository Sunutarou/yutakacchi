function resizeGame() {
    const container = document.getElementById('game-container');
    const width = window.innerWidth;
    const height = window.innerHeight;
    
    // 画面の比率とゲームの比率を比較して倍率を決定
    const scale = Math.min(width / 450, height / 950);
    
    container.style.transform = `scale(${scale})`;
    
    // 中央寄せの計算
    const scaledWidth = 450 * scale;
    const scaledHeight = 950 * scale;
    container.style.left = (width - scaledWidth) / 2 + 'px';
    container.style.top = (height - scaledHeight) / 2 + 'px';
}

function stopKusamiDance() {
    if (kusamiDanceTimer) {
        clearInterval(kusamiDanceTimer);
        kusamiDanceTimer = null;
    }
}

function updateKusamiDanceImage() {
    const charImg = document.getElementById("char-image");

    if (kusamiDanceIndex === 0) {
        charImg.src = "images/Kusami.left.png";
    } else if (kusamiDanceIndex === 1) {
        charImg.src = "images/Kusami.dot.png";
    } else if (kusamiDanceIndex === 2) {
        charImg.src = "images/Kusami.right.png";
    } else {
        charImg.src = "images/Kusami.dot.png";
    }
}

function startKusamiDance() {
    stopKusamiDance();

    kusamiDanceIndex = 0;
    updateKusamiDanceImage();

    kusamiDanceTimer = setInterval(() => {
        kusamiDanceIndex++;
        if (kusamiDanceIndex > 3) {
            kusamiDanceIndex = 0;
        }
        updateKusamiDanceImage();
    }, 300);
}

    function filterOneTimeEvents(events) {
    return events.filter(event => {

function pickRandomEvent(events) {
    const filteredEvents = filterOneTimeEvents(events);

    if (filteredEvents.length === 0) return null;

    const totalRate = filteredEvents.reduce((sum, e) => sum + e.rate, 0);
    let rand = Math.random() * totalRate;

    for (const event of filteredEvents) {
        rand -= event.rate;
        if (rand <= 0) return event;
    }

    return filteredEvents[0];
}

    record.maxWeek = Math.max(record.maxWeek || 0, gameState.totalWeek);

if (gameState.money >= goal) {

    }

    savePlayRecord(record);
}
